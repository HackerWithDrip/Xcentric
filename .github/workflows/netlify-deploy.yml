name: 🚀 Deploy to Netlify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 🔧 Install dependencies
      run: |
        cd frontend
        npm ci --prefer-offline --no-audit
        
    - name: 🧪 Run linting
      run: |
        cd frontend
        npm run lint
        
    - name: 🏗️ Build project
      run: |
        cd frontend
        npm run build
        
    - name: 📊 Build summary
      run: |
        echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Build time**: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- **Node version**: $(node --version)" >> $GITHUB_STEP_SUMMARY
        echo "- **NPM version**: $(npm --version)" >> $GITHUB_STEP_SUMMARY
        echo "- **Build directory**: frontend/dist" >> $GITHUB_STEP_SUMMARY
        echo "- **Total size**: $(du -sh frontend/dist | cut -f1)" >> $GITHUB_STEP_SUMMARY

  deploy-preview:
    name: 🎭 Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 🔧 Install dependencies
      run: |
        cd frontend
        npm ci --prefer-offline --no-audit
        
    - name: 🏗️ Build project
      run: |
        cd frontend
        npm run build
        
    - name: 🎭 Deploy preview to Netlify
      uses: nwtgck/actions-netlify@v3.0
      with:
        publish-dir: './frontend/dist'
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Preview: ${{ github.event.pull_request.title }}"
        enable-pull-request-comment: true
        overwrites-pull-request-comment: true
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: 🔧 Install dependencies
      run: |
        cd frontend
        npm ci --prefer-offline --no-audit
        
    - name: 🏗️ Build project
      run: |
        cd frontend
        npm run build
        
    - name: 🚀 Deploy to Netlify Production
      uses: nwtgck/actions-netlify@v3.0
      with:
        publish-dir: './frontend/dist'
        production-branch: main
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "🚀 Production Deploy - ${{ github.sha }}"
        enable-commit-comment: true
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        
    - name: 🎉 Deployment success
      run: |
        echo "## 🎉 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: Production" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Site URL**: https://xcentric.netlify.app" >> $GITHUB_STEP_SUMMARY
